# Single-host production (one VM). For AWS ECS see infrastructure/terraform.
#   cp .env.production.example .env.production   # fill in every value
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# Caddy terminates TLS with automatic Let's Encrypt certificates for $DOMAIN.
# Back up the pg_data volume (see docs/DEPLOYMENT.md) — this setup has no managed backups.

x-server-env: &server-env
  NODE_ENV: production
  PORT: "3000"
  TRUST_PROXY: "true"
  DATABASE_URL: postgresql://hrms:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/hrms?connection_limit=10
  RABBITMQ_URL: amqp://hrms:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}@rabbitmq:5672
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (>= 32 chars)}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY (openssl rand -base64 32)}
  FRONTEND_URL: https://${DOMAIN:?set DOMAIN}
  CORS_ORIGINS: https://${DOMAIN}
  STORAGE_DRIVER: s3
  AWS_REGION: ${AWS_REGION:?set AWS_REGION}
  AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:?set AWS_S3_BUCKET_NAME}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?set AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?set AWS_SECRET_ACCESS_KEY}
  EMAIL_DRIVER: ses
  EMAIL_FROM: ${EMAIL_FROM:?set EMAIL_FROM}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GOOGLE_CALLBACK_URL: https://${DOMAIN}/api/v1/auth/google/callback
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  STRIPE_PRICE_BASIC: ${STRIPE_PRICE_BASIC:-}
  STRIPE_PRICE_BUSINESS: ${STRIPE_PRICE_BUSINESS:-}
  STRIPE_PRICE_ENTERPRISE: ${STRIPE_PRICE_ENTERPRISE:-}
  SENTRY_DSN: ${SENTRY_DSN:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hrms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: hrms
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrms -d hrms"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: hrms
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Applies pending migrations, then exits. The API only starts after it succeeds.
  migrate:
    build: { context: ., dockerfile: apps/server/Dockerfile }
    image: hrms-server:local
    command: ["npx", "prisma", "migrate", "deploy"]
    environment: *server-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  server:
    image: hrms-server:local
    environment: *server-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
    restart: unless-stopped
    stop_grace_period: 30s

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    volumes:
      - ./infrastructure/nginx/api-proxy.conf:/etc/nginx/snippets/api-proxy.conf:ro
    depends_on: [server]
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./infrastructure/nginx/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [web]
    restart: unless-stopped

volumes:
  pg_data:
  rabbitmq_data:
  caddy_data:
