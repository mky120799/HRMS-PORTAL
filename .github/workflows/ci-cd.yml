name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Static checks + unit tests ─────────────────────────────────────────────
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma generate
        working-directory: apps/server
        env: { DATABASE_URL: postgresql://x:x@localhost:5432/x }
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
        env: { VITE_API_BASE_URL: /api/v1 }
      - name: Dependency audit (production, critical)
        run: npm audit --omit=dev --audit-level=critical

  # ── API integration tests against real PostgreSQL + RabbitMQ + Redis ───────
  api-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: hrms, POSTGRES_PASSWORD: hrms, POSTGRES_DB: hrms_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U hrms" --health-interval 5s --health-retries 10
      rabbitmq:
        image: rabbitmq:4-alpine
        ports: ["5672:5672"]
        options: --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      NODE_ENV: test
      REDIS_URL: redis://localhost:6379
      DATABASE_URL: postgresql://hrms:hrms@localhost:5432/hrms_test
      RABBITMQ_URL: amqp://guest:guest@localhost:5672
      JWT_SECRET: ci-secret-at-least-32-characters-long-000
      ENCRYPTION_KEY: Y2ktb25seS1rZXktMzItYnl0ZXMtbG9uZy0wMDAwMDA=
      LOCAL_STORAGE_DIR: /tmp/hrms-storage
      EMAIL_DRIVER: log
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Migrate (also proves migrations apply cleanly from scratch)
        run: npx prisma migrate deploy && npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
        working-directory: apps/server
      - name: Shared rate-limit store against real Redis
        run: npx jest src/common/rate-limit
        working-directory: apps/server
        env: { REDIS_TEST_URL: redis://localhost:6379 }
      - run: npm run test:e2e:api

  # ── Browser smoke test of the full stack ──────────────────────────────────
  ui-e2e:
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: hrms, POSTGRES_PASSWORD: hrms, POSTGRES_DB: hrms_ui }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U hrms" --health-interval 5s --health-retries 10
      rabbitmq:
        image: rabbitmq:4-alpine
        ports: ["5672:5672"]
        options: --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://hrms:hrms@localhost:5432/hrms_ui
      JWT_SECRET: ci-secret-at-least-32-characters-long-000
      ENCRYPTION_KEY: Y2ktb25seS1rZXktMzItYnl0ZXMtbG9uZy0wMDAwMDA=
      LOCAL_STORAGE_DIR: /tmp/hrms-storage
      RABBITMQ_URL: amqp://guest:guest@localhost:5672
      VITE_API_BASE_URL: http://localhost:3000/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma migrate deploy
        working-directory: apps/server
      - run: npm run build
      - run: npx playwright install --with-deps chromium
        working-directory: apps/e2e
      - run: npm run test:e2e:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: apps/e2e/playwright-report }

  # ── Container build (+ vulnerability scan) ────────────────────────────────
  images:
    runs-on: ubuntu-latest
    needs: [verify, api-e2e]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/server/Dockerfile -t hrms-server:${{ github.sha }} .
      - run: docker build -f apps/web/Dockerfile -t hrms-web:${{ github.sha }} .
      - name: Scan server image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: hrms-server:${{ github.sha }}
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  # ── Deploy (main only, gated by the "production" environment approval) ───
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [images, ui-e2e]
    runs-on: ubuntu-latest
    environment: production # configure required reviewers in repo settings
    permissions:
      id-token: write # OIDC — no long-lived AWS keys in GitHub
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build & push images
        run: |
          docker build -f apps/server/Dockerfile -t ${{ steps.ecr.outputs.registry }}/hrms-server:$IMAGE_TAG .
          docker build -f apps/web/Dockerfile -t ${{ steps.ecr.outputs.registry }}/hrms-web:$IMAGE_TAG .
          docker push ${{ steps.ecr.outputs.registry }}/hrms-server:$IMAGE_TAG
          docker push ${{ steps.ecr.outputs.registry }}/hrms-web:$IMAGE_TAG
      - name: Migrate and roll out
        run: ./infrastructure/scripts/deploy.sh
        env: { ENVIRONMENT: production }
